[workspace]
members = [
    "crates/aurora-domain",
    "crates/aurora-osint",
    "crates/aurora-factory",
    "crates/aurora-pulse",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PROPRIETARY"
authors = ["Daniel Malpica"]
repository = "https://github.com/07malpicadaniel-del/Aurora_v1.git"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "2.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.40", features = ["full"] }
aurora-domain = { path = "crates/aurora-domain" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
