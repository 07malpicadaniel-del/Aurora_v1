[workspace]
members = [
    "crates/aurora-domain",
    "crates/aurora-osint",
    "crates/aurora-memory",
    "crates/aurora-cortex",
    "crates/aurora-factory",
    "crates/aurora-pulse",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PROPRIETARY"
authors = ["Daniel Malpica"]
repository = "https://github.com/07malpicadaniel-del/Aurora_v1.git"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "2.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rayon = "1.12"
scraper = "0.27"
strsim = "0.11"
regex = "1.13"
unicode-normalization = "0.1"
async-trait = "0.1"
parking_lot = "0.12"
aurora-domain = { path = "crates/aurora-domain" }
aurora-osint = { path = "crates/aurora-osint" }
aurora-memory = { path = "crates/aurora-memory" }
aurora-cortex = { path = "crates/aurora-cortex" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
