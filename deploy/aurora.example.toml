# Configuración de ejemplo para aurora-daemon (Aurora v2 en Arch Linux)
# Copiar a ~/.config/aurora/aurora.toml o apuntar con AURORA_CONFIG_PATH

# Dirección HTTP/WebSocket/SSE local consumida por el Cockpit axis_v1
bind_addr = "127.0.0.1:8090"

# Endpoint único del modelo residente en RTX 5060 Ti (Qwen 27B IQ3_S imatrix, slot_id = 0 obligatorio)
# Diagnóstico rápido de conectividad e inferencia GBNF: `cargo run -p aurora-daemon --bin aurora-smoke`
bob_url = "http://127.0.0.1:8086"
bob_slot_id = 0

# Rutas XDG en NVMe local (~ se expande a $HOME)
data_dir = "~/.local/share/aurora"
# Opcionalmente personalizables por separado:
# wal_dir = "~/.local/share/aurora/wal"
# artefactos_dir = "~/.local/share/aurora/artefactos"
# dpo_dir = "~/.local/share/aurora/dpo"

# Modo de operación:
# - "real_con_fallback": usa motores reales y cae limpio a respaldo si falta un servicio/binario
# - "estricto_real": exige BOB, Piper, Chromium y FFmpeg reales al arranque
# - "simulado_offline": adaptadores deterministas en memoria para CI/pruebas
modo_ejecucion = "real_con_fallback"
modo_offline = false

# Conectores OSINT reales de México (LFPDPPP estricto sobre fuentes públicas)
# Token gratuito oficial DENUE / INEGI (o vía env AURORA_INEGI_TOKEN); si se omite, se salta sin error
# inegi_token = ""
osint_web_publica_habilitada = true
# Opcional: lista personalizada de directorios/portales corporativos públicos de México
# osint_web_publica_urls = []

# Scheduler circadiano autónomo DPO (respeta exclusividad slot_id = 0 de BOB)
dpo_scheduler_habilitado = true
dpo_hora_utc = 9
dpo_intervalo_minutos = 360

# Locución neuronal en CPU/RAM (Ryzen 9, 0 MB VRAM)
piper_bin = "piper"
piper_model = "~/.local/share/aurora/models/tts/es_MX-ald-medium.onnx"
# piper_speaker_id = 0

# Navegador headless CPU (--headless=new --disable-gpu) y Chrome DevTools Protocol para SPAs
chromium_bin = "chromium"
cdp_url = "http://127.0.0.1:9222"

# Compositor FFmpeg con aceleración RTX 5060 Ti NVENC y fallback libx264 CPU
ffmpeg_bin = "ffmpeg"
usar_nvenc = true

[factory]
# Biblioteca local en NVMe de clips maestros B-Roll (Higgsfield) sin texto ni voz + cola de briefs
# Override por entorno: AURORA_BROLL_DIR
broll_dir = "~/.local/share/aurora/assets/broll"

[smtp]
# Activa el transporte real tokio1-rustls-tls tras aprobación Gatekeeper y correo destino
habilitado = false
host = "smtp.resend.com"
puerto = 587
# usuario = "resend"
# password se recomienda inyectar vía AURORA_SMTP_PASSWORD en EnvironmentFile
remitente_nombre = "Aurora Inteligencia Comercial"
remitente_correo = "aurora@localhost.localdomain"
usar_tls_starttls = true
usar_tls_implicito = false
url_base_opt_out = "http://127.0.0.1:8090/api/v1/lfpdppp/opt-out"
adjuntar_dossier_pdf = true
adjuntar_reel_si_menor_a_mb = 12
timeout_ms = 15000

[council]
# Binarios CLI headless del Consejo Multi-Agente (cascada Claude -> Codex -> Gemini -> OpenCode -> BOB Local)
claude_bin = "claude"
codex_bin = "codex"
gemini_bin = "gemini"
opencode_bin = "opencode"
# Presupuestos conservadores de ventana móvil de 5 horas y tope diario para proteger suscripciones Pro/Plus
claude_max_5h = 10
claude_max_diario = 30
codex_max_5h = 12
codex_max_diario = 36
gemini_max_5h = 25
gemini_max_diario = 100
opencode_max_5h = 60
opencode_max_diario = 240
cooldown_rate_limit_segundos = 1800
timeout_ms = 90000
# Ruta persistente atómica del libro de cuotas en NVMe (si se omite usa <data_dir>/quota_state.json)
quota_state_path = "~/.local/share/aurora/quota_state.json"

[forge]
# Sandbox aislado en git worktree bajo ramas forge/<id> (Carril Ámbar: prohibido tocar main o auto-merge)
habilitado = true
worktrees_dir = "~/.local/share/aurora/forge_worktrees"
# repo_root = "/ruta/al/repositorio/Aurora_v1"
timeout_segundos = 300

[scheduler]
# Orquestador AFK 24/7 de Carril Verde (sin PII ni envíos en frío automáticos)
hunt_programado_habilitado = false
hunt_intervalo_minutos = 360
publicacion_organica_habilitada = false
organico_intervalo_minutos = 120
# Ejemplo de plaza programada (activar solo con hunt_programado_habilitado = true):
# [[scheduler.plazas_osint]]
# ciudad = "Monterrey"
# estado = "Nuevo León"
# zona = "Apodaca Industrial"
# vertical = { Inmobiliaria = "ComercialIndustrial" }
# palabras_clave = ["nave industrial", "parque logístico"]
# limite_resultados = 10

# Portal móvil seguro sobre Tailscale (`GET /mobile`):
# Si cambias bind_addr a tu IP Tailscale (ej. "100.x.y.z:8090"), define AURORA_MOBILE_TOKEN en secrets.env.
# Publicación orgánica oficial (inyectar vía ~/.config/aurora/secrets.env):
# AURORA_YOUTUBE_ACCESS_TOKEN, AURORA_META_IG_USER_ID, AURORA_META_ACCESS_TOKEN, AURORA_META_MEDIA_BASE_URL,
# AURORA_TIKTOK_ACCESS_TOKEN, AURORA_TIKTOK_MODE ("inbox" | "direct_post")

[factory]
# Directorio NVMe de la biblioteca B-Roll e índice Higgsfield (<data_dir>/assets/broll si se omite)
broll_dir = "~/.local/share/aurora/assets/broll"
# Puente opcional API Higgsfield (inyectar preferentemente vía AURORA_HIGGSFIELD_API_KEY en secrets.env):
# higgsfield_api_url = "https://api.higgsfield.ai/v1/generations"
